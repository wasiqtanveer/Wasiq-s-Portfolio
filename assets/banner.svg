<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Wasiq Tanveer — portfolio terminal">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#39ff14" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#39ff14" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#0d1a0d" opacity="0.55"/>
    </pattern>
    <style>
      .m { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="380" fill="#000000"/>
  <circle cx="240" cy="120" r="300" fill="url(#halo)"/>
  <circle cx="1010" cy="300" r="260" fill="url(#halo)"/>

  <!-- starfield -->
  <g fill="#39ff14">
    <circle cx="140" cy="52"  r="1.6" opacity="0.55"/><circle cx="1088" cy="88" r="1.3" opacity="0.4"/>
    <circle cx="330" cy="330" r="1.8" opacity="0.35"/><circle cx="900"  cy="42" r="1.4" opacity="0.5"/>
    <circle cx="1150" cy="210" r="1.7" opacity="0.4"/><circle cx="70"  cy="300" r="1.4" opacity="0.45"/>
    <circle cx="620" cy="24"  r="1.2" opacity="0.3"/> <circle cx="1130" cy="356" r="1.5" opacity="0.3"/>
  </g>

  <!-- ── terminal window ──────────────────────────────────────────── -->
  <g>
    <rect x="60" y="44" width="1080" height="292" rx="14" fill="#050b05" stroke="#1d3b1d" stroke-width="1.5"/>
    <rect x="60" y="44" width="1080" height="292" rx="14" fill="url(#lines)"/>
    <rect x="60" y="44" width="1080" height="120" rx="14" fill="url(#scan)"/>

    <!-- title bar -->
    <path d="M60 58 a14 14 0 0 1 14 -14 h1052 a14 14 0 0 1 14 14 v24 h-1080 z" fill="#0a140a"/>
    <line x1="60" y1="82" x2="1140" y2="82" stroke="#1d3b1d" stroke-width="1.5"/>
    <circle cx="86"  cy="63" r="5.5" fill="#ff5f56"/>
    <circle cx="106" cy="63" r="5.5" fill="#ffbd2e"/>
    <circle cx="126" cy="63" r="5.5" fill="#27c93f"/>
    <text class="m" x="600" y="68" font-size="12.5" fill="#3f7a3f" text-anchor="middle">waaazek@portfolio &#8212; zsh &#8212; 120&#215;32</text>

    <!-- body -->
    <g class="m" font-size="15">
      <text x="88" y="118" fill="#39ff14">$</text>
      <text x="110" y="118" fill="#d8ffd8">whoami</text>

      <text x="88" y="152" font-size="30" fill="#39ff14" font-weight="700" letter-spacing="-0.5">MUHAMMAD WASIQ TANVEER</text>
      <text x="88" y="180" font-size="15" fill="#7ecb7e">Full-Stack Developer &#183; Automation Engineer &#183; Kohat, PK</text>

      <text x="88" y="220" fill="#39ff14">$</text>
      <text x="110" y="220" fill="#d8ffd8">cat stack.txt</text>
      <text x="88"  y="248" fill="#5aa85a">react &#183; node &#183; python &#183; mysql &#183; three.js &#183; gsap &#183; llm apis</text>

      <text x="88" y="286" fill="#39ff14">$</text>
      <text x="110" y="286" fill="#d8ffd8">./launch --companion</text>
      <text x="88"  y="314" fill="#5aa85a">waaazek online &#8212; ask me anything about him</text>
      <rect x="446" y="300" width="11" height="19" fill="#39ff14"/>
    </g>

    <!-- robot mark -->
    <g transform="translate(958,168)" opacity="0.95">
      <rect x="-42" y="-32" width="84" height="66" rx="16" fill="none" stroke="#39ff14" stroke-width="3"/>
      <rect x="-24" y="-14" width="20" height="15" rx="4" fill="#39ff14"/>
      <rect x="4"   y="-14" width="20" height="15" rx="4" fill="#39ff14"/>
      <path d="M-18 16 h36" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
      <path d="M-14 -32 v-14" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
      <path d="M14 -32 v-20"  stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-14" cy="-50" r="4.5" fill="#39ff14"/>
      <circle cx="14"  cy="-56" r="4.5" fill="#39ff14"/>
      <path d="M-42 -6 h-14 v18 h14" fill="none" stroke="#39ff14" stroke-width="3" stroke-linejoin="round"/>
      <path d="M42 -6 h14 v18 h-14"  fill="none" stroke="#39ff14" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <text class="m" x="600" y="364" font-size="12" fill="#2f5f2f" text-anchor="middle" letter-spacing="3">THREE.JS &#183; GSAP &#183; LENIS &#183; DUAL-PROVIDER AI</text>
